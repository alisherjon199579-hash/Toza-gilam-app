name: Printer sinov dasturi

on:
  push:
    paths:
      - 'diag/**'
      - '.github/workflows/diag.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK yig'ish
        run: gradle -p diag assembleDebug --no-daemon
      - name: Faylni tayyorlash
        run: cp diag/app/build/outputs/apk/debug/app-debug.apk printer-sinov.apk
      - name: Yuklab olish sahifasiga qo'yish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete diag --yes --cleanup-tag || true
          gh release create diag printer-sinov.apk \
            --target "$GITHUB_SHA" \
            --title "Printer sinov dasturi" \
            --notes "Terminalga o'rnatib, natijani suratga oling."
