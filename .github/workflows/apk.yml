name: APK yig'ish

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK yig'ish
        run: gradle -p android assembleRelease --no-daemon

      - name: Faylni tayyorlash
        run: cp android/app/build/outputs/apk/release/app-release.apk toza-gilam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: toza-gilam-apk
          path: toza-gilam.apk

      - name: Yuklab olish sahifasiga qo'yish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk toza-gilam.apk \
            --target "$GITHUB_SHA" \
            --title "Toza Gilam ilovasi (1.0.${GITHUB_RUN_NUMBER})" \
            --notes "Telefonda toza-gilam.apk faylini bosib yuklab oling va o'rnating."
