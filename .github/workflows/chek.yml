name: Chek dasturi

on:
  push:
    paths:
      - 'chek/**'
      - '.github/workflows/chek.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK yig'ish
        run: gradle -p chek assembleDebug --no-daemon
      - name: Faylni tayyorlash
        run: cp chek/app/build/outputs/apk/debug/app-debug.apk toza-gilam-chek.apk
      - name: Yuklab olish sahifasiga qo'yish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete chek --yes --cleanup-tag || true
          gh release create chek toza-gilam-chek.apk \
            --target "$GITHUB_SHA" \
            --title "Toza Gilam Chek" \
            --notes "Kassa terminaliga o'rnatiladigan chek dasturi."
