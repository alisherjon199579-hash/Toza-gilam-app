plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.tozagilam.diag'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.tozagilam.diag'
        minSdk 21
        targetSdk 22
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug { }
    }

    lint {
        abortOnError false
    }
}
