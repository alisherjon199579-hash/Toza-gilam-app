plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.tozagilam.chek'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.tozagilam.chek'
        minSdk 21
        targetSdk 22
        versionCode 6
        versionName "6.0"
    }

    signingConfigs {
        shared {
            storeFile file('kuryer.p12')
            storeType 'pkcs12'
            storePassword 'tozagilam'
            keyAlias 'kuryer'
            keyPassword 'tozagilam'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
